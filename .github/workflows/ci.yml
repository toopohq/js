name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: No runtime dependencies
        if: ${{ !cancelled() }}
        run: jq -e 'has("dependencies") | not' package.json
      - name: One function folder per pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          touched=$(git diff --name-only "$RANGE" -- 'functions/*/*/*' | cut -d/ -f2,3 | sort -u)
          [ "$(grep -c . <<< "$touched")" -le 1 ] || { echo "::error::One function folder per pull request:" $touched; exit 1; }
      - name: Title, sign-off, no assistant attribution
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: \S' <<< "$TITLE" \
            || { echo "::error::The title is not a Conventional Commit: $TITLE"; exit 1; }
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: ' \
              || { echo "::error::$sha has no Signed-off-by line"; exit 1; }
          done
          if { echo "$TITLE"; echo "$BODY"; git log --format=%B "$RANGE"; } | grep -E 'Co-[Aa]uthored-[Bb]y|Claude|Generated with'; then
            echo "::error::Assistant attribution in the title, the body or a commit"; exit 1
          fi
      - name: Deploy to toopo.dev, and the deployment serves every file
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          pnpm emit
          npx --yes wrangler@4.137.0 pages deploy dist --project-name=toopo-js --branch=main
          url=$(jq -r 'select(.type == "pages-deploy-detailed").url' "$WRANGLER_OUTPUT_FILE_PATH")
          cd dist
          for file in js/*/*.*; do curl -fsS "$url/$file" | cmp - "$file"; done
          for file in js/*/*.json; do curl -fsS "$url/${file%.json}" | cmp - "$file"; done
          for file in js/*/*.[jt]s; do curl -fsS -o /dev/null -w '%{content_type}' "$url/$file" | grep -q 'charset=utf-8$'; done
