name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: One function folder per pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          touched=$(git diff --name-only "$RANGE" -- 'functions/*/*/*' | cut -d/ -f2,3 | sort -u)
          [ "$(grep -c . <<< "$touched")" -le 1 ] || { echo "::error::One function folder per pull request:" $touched; exit 1; }
      - name: Title, sign-off, no assistant attribution
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: \S' <<< "$TITLE" \
            || { echo "::error::The title is not a Conventional Commit: $TITLE"; exit 1; }
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: ' \
              || { echo "::error::$sha has no Signed-off-by line"; exit 1; }
          done
          if { echo "$TITLE"; echo "$BODY"; git log --format=%B "$RANGE"; } | grep -E 'Co-[Aa]uthored-[Bb]y|Claude|Generated with'; then
            echo "::error::Assistant attribution in the title, the body or a commit"; exit 1
          fi
      - name: A version toopo.dev serves keeps its emissions, and none goes back
        if: ${{ !cancelled() }}
        run: |
          pnpm emit
          for record in dist/js/*/*.json; do
            address=${record#dist/}; address=${address%.json}
            status=$(curl -sS --retry 3 -o "$RUNNER_TEMP/served.json" -w '%{http_code}' "https://toopo.dev/$address")
            [ "$status" = 404 ] && continue
            [ "$status" = 200 ] || { echo "::error::toopo.dev answered $status for $address"; exit 1; }
            jq -e --slurpfile served "$RUNNER_TEMP/served.json" '
              def v: .version | split(".") | map(tonumber);
              $served[0] as $s | v > ($s | v) or (v == ($s | v) and .emissions == $s.emissions)' "$record" > /dev/null \
              || { echo "::error::$address: toopo.dev serves $(jq -r .version "$RUNNER_TEMP/served.json"), this is $(jq -r .version "$record") with other emissions or below it"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/deploy
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix .github/deploy
      - name: Deploy to toopo.dev, and the deployment serves every file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name=toopo-js --branch=preview
          cd dist
          url=$(jq -er 'select(.type == "pages-deploy-detailed" and .environment == "preview").url' "$WRANGLER_OUTPUT_FILE_PATH")
          get() { curl -fsS --retry 3 --retry-all-errors "$@"; }
          for file in js/*/*.*; do get "$url/$file" | cmp - "$file"; done
          for file in js/*/*.json; do get "$url/${file%.json}" | cmp - "$file"; done
          for file in js/*/*.[jt]s; do get -o /dev/null -w '%{content_type}' "$url/$file" | grep -qE '^text/(plain|javascript); charset=utf-8$'; done
